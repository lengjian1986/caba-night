server {
    listen 80 default_server;
    server_name  www.likeadmin.host _;
    access_log /logs/www.likeadmin.host_access_nginx.log;
    error_log /logs/www.likeadmin.host_error_nginx.log;
    client_max_body_size 5M;

    location ^~ /admin/ {
        root /likeadmin_php/server/public;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }
    location ^~ /uploads/ {
        root /likeadmin_php/server/public;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
    }
    location = /shop-portal {
        return 302 /admin/shop-portal/login;
    }
    location ^~ /shop-portal/ {
        return 302 $scheme://$http_host/admin$request_uri;
    }
    location / {
        root   /likeadmin_php/server/public;
        index  index.html index.htm index.php;
        if (!-e $request_filename)
        {
            rewrite ^/(.*)$ /index.php?s=$1 last;
            break;
        }
    }
    location ~ /.*\.php/ {
        rewrite ^(.*?/?)(.*\.php)(.*)$ /$2?s=$3 last;
        break;
    }
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /var/www/html;
    }

    location ~ \.php$ {
        fastcgi_pass   likeadmin-php:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME  /likeadmin_php/server/public$fastcgi_script_name;
        include        fastcgi_params;
    }
    location = /favicon.ico {
            log_not_found off;
            access_log off;
        }
}
